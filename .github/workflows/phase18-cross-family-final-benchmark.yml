name: Phase 18 Cross-Family Final Visual Benchmark

on:
  push:
    branches:
      - phase18/original-visual-benchmark
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cross-family-benchmark:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Test cross-family visual runtime
        run: |
          python -m unittest -v tests.test_phase18_cross_family_visual_system
          python -m unittest -v tests.test_phase18_visual_scene_blueprint
          python -m unittest -v tests.test_phase18_original_family_scene_renderer
      - name: Build twelve visual studies
        run: python tools/phase18_build_cross_family_final_benchmark.py
      - name: Verify artifact contract
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('artifacts/phase18/cross-family-final/manifest.json')
          data=json.loads(p.read_text())
          assert data['count']==12
          assert len(data['families'])==6
          for item in data['images']:
              f=Path(item['output_path']); assert f.is_file(), f
              assert hashlib.sha256(f.read_bytes()).hexdigest()==item['sha256']
              assert item['width']==1080 and item['height']==1350
              for key in ('source_photo_used','generator_used','network_used','fabricated_crest_used','placeholder_used','real_person_depicted','publication_ready'):
                  assert item[key] is False, (key,item)
          print(json.dumps(data,indent=2))
          PY
      - name: Upload cross-family benchmark
        uses: actions/upload-artifact@v7
        with:
          name: phase18-cross-family-final-benchmark
          path: artifacts/phase18/cross-family-final/
          if-no-files-found: error
          retention-days: 14
