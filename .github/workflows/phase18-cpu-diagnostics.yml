name: Phase 18 CPU Verification Diagnostics

on:
  push:
    branches: ['phase18/**']
    paths:
      - 'engine/intelligence/**'
      - 'tools/phase18_*.py'
      - 'tests/test_phase18_*.py'
      - '.github/workflows/phase18-cpu-diagnostics.yml'
  pull_request:
    paths:
      - 'engine/intelligence/**'
      - 'tools/phase18_*.py'
      - 'tests/test_phase18_*.py'
      - '.github/workflows/phase18-cpu-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-diagnostics:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fail-closed Phase 18 CPU validator
        id: cpu_validate
        continue-on-error: true
        run: python tools/phase18_cpu_validate.py

      - name: Surface deterministic CPU failure fingerprint
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('output/phase18_cpu_validation/report.json')
          if not report_path.is_file():
              raise SystemExit('Phase 18 CPU validator did not produce its deterministic report')

          report = json.loads(report_path.read_text(encoding='utf-8'))
          status = str(report.get('status', 'UNKNOWN'))
          failed_index = report.get('failed_command_index')
          commands = report.get('commands') or []
          failed = commands[failed_index] if isinstance(failed_index, int) and failed_index < len(commands) else None

          summary_lines = [
              '## Phase 18 CPU validation fingerprint',
              '',
              f'- status: `{status}`',
              f'- failed_command_index: `{failed_index}`',
          ]
          if isinstance(failed, dict):
              summary_lines.extend([
                  f"- returncode: `{failed.get('returncode')}`",
                  f"- command: `{' '.join(str(x) for x in failed.get('command', []))}`",
                  '',
                  '### stderr tail',
                  '```text',
                  '\n'.join(str(failed.get('stderr', '')).splitlines()[-80:]),
                  '```',
                  '',
                  '### stdout tail',
                  '```text',
                  '\n'.join(str(failed.get('stdout', '')).splitlines()[-80:]),
                  '```',
              ])

          summary = '\n'.join(summary_lines) + '\n'
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as handle:
                  handle.write(summary)

          print(summary)
          PY

      - name: Upload deterministic CPU validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 'PUL7SAR-phase18-cpu-validation-${{ github.sha }}'
          path: output/phase18_cpu_validation/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve validator failure semantics
        if: steps.cpu_validate.outcome != 'success'
        run: |
          echo 'Phase 18 CPU validation failed; diagnostic artifact was retained.' >&2
          exit 1
