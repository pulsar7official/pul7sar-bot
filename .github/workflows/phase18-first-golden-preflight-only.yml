name: Phase 18 First Golden Preflight Only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PHASE18_FIRST_GOLDEN_PREFLIGHT_ONLY to inspect the candidate NVIDIA host without generation"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase18-first-golden-preflight-only
  cancel-in-progress: false

jobs:
  first-golden-preflight-only:
    runs-on: [self-hosted, linux, x64, gpu, cuda, bf16, pul7sar-phase18]
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PUL7SAR_PHASE18_COST_MODE: $0-local
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Require exact Phase 18 dispatch
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PHASE18_FIRST_GOLDEN_PREFLIGHT_ONLY"
          test "$DISPATCH_REF" = "refs/heads/phase18/story-intelligence"
          printf '%s' "$DISPATCH_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout immutable Phase 18 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove branch and source isolation
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          git checkout -B phase18/story-intelligence "$DISPATCH_SHA"
          test "$(git branch --show-current)" = "phase18/story-intelligence"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -f tools/phase18_probe_first_golden_execution_blocker.py
          test -f tools/phase18_capture_zero_cost_network_guard_evidence.py
          test -f tools/phase18_capture_first_golden_runner_identity.py
          test -f tools/phase18_capture_approved_snapshot_inventory.py

      - name: Capture zero-cost network guard evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_capture_zero_cost_network_guard_evidence.py \
            --output output/phase18_gpu_smoke/preflight-zero-cost-network-guard.json

      - name: Capture runner and CUDA identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_capture_first_golden_runner_identity.py \
            --output output/phase18_gpu_smoke/preflight-runner-identity.json

      - name: Capture exact approved local snapshot inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_capture_approved_snapshot_inventory.py \
            --output output/phase18_gpu_smoke/preflight-approved-snapshot-inventory.json

      - name: Probe exact first-Golden execution blockers without generation
        id: blocker_probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_probe_first_golden_execution_blocker.py \
            --output output/phase18_gpu_smoke/preflight-execution-blocker.json

      - name: Assert preflight readiness and preserve fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("output/phase18_gpu_smoke/preflight-execution-blocker.json").read_text(encoding="utf-8"))
          if p.get("schema") != "pul7sar-phase18-first-golden-execution-blocker-probe-v6":
              raise SystemExit("preflight blocker schema drift")
          for field in ("authoritative_gate", "network_download_authorized", "generation_authorized", "publication_ready", "seeds_2_to_4_authorized"):
              if p.get(field) is not False:
                  raise SystemExit(f"preflight authority drift: {field}")
          if p.get("ready_for_authoritative_golden_preflight") is not True:
              raise SystemExit("candidate host is not ready for authoritative Golden preflight: " + ",".join(p.get("blockers") or []))
          if p.get("blockers") != []:
              raise SystemExit("ready preflight unexpectedly contains blockers")
          PY

      - name: Upload preflight diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase18-first-golden-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3
          path: output/phase18_gpu_smoke/**
