name: PUL7SAR Sports Bot

on:
  schedule:
    - cron: '0 */3 * * *'  # يعمل تلقائياً كل 3 ساعات (يمكنك تعديلها حسب رغبتك)
  workflow_dispatch:       # يتيح لك تشغيله يدوياً متى ما أردت من تبويب Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 pillow duckduckgo-search

      - name: Run Main Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          GIT_AUTO_PUSH: "true"
        run: |
          python main.py
