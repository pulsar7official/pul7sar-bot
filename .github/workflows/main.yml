name: PUL7SAR Ultimate Sports Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
- name: Install Dependencies
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt

      - name: Run Main Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit Updated History
        run: |
          git config --global user.name "PUL7SAR Bot"
          git config --global user.email "bot@pul7sar.internal"
          git add posted_history.json || true
          git commit -m "Update posted history [skip ci]" || true
          git push || true
