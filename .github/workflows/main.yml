name: PUL7SAR Telegram Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Packages
        run: |
          pip install requests

      - name: Generate Content & Post to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import json

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not api_key:
              raise Exception("❌ GEMINI_API_KEY غير موجود في GitHub Secrets!")

          # 1. طلب توليد النص من Google Gemini عبر API المباشر
          gemini_url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
          
          headers = {'Content-Type': 'json'}
          payload = {
              "contents": [{
                  "parts": [{"text": "اكتب منشوراً رياضياً مشوقاً وقصيراً لمنصة PUL7SAR يغطي أبرز أخبار كرة القدم العالمية اليوم مع إيموجيات مناسبة للتليجرام."}]
              }]
          }

          print("🔄 جاري الاتصال بـ Google Gemini API...")
          response = requests.post(gemini_url, json=payload)

          if response.status_code != 200:
              print(f"❌ خطأ من Google API ({response.status_code}): {response.text}")
              raise Exception(f"فشل الاتصال بـ Gemini API: {response.text}")

          data = response.json()
          try:
              generated_text = data['candidates'][0]['content']['parts'][0]['text']
              print("✅ تم توليد النص بنجاح!")
          except Exception as e:
              print(f"❌ تعذر استخراج النص من الاستجابة: {data}")
              raise e

          # 2. إرسال النص إلى تليجرام
          telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          tele_payload = {
              "chat_id": chat_id,
              "text": generated_text
          }

          tele_res = requests.post(telegram_url, json=tele_payload)
          if tele_res.status_code == 200:
              print("🚀 تم النشر بنجاح على قناة التليجرام!")
          else:
              print(f"❌ خطأ أثناء الإرسال للتليجرام: {tele_res.text}")
              raise Exception(tele_res.text)
          EOF
