name: PUL7SAR Ultimate Sports Engine

on:
  workflow_dispatch: # يسمح بتشغيل البوت يدوياً من تبويب Actions
  schedule:
    - cron: '0 * * * *' # يتم التشغيل تلقائياً كل ساعة (عند الدقيقة 0)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # مطلوب للسماح للـ action بعمل git commit و push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # استخدام أحدث إصدار مستقر

      - name: Set up Python
        uses: actions/setup-python@v5 # استخدام أحدث إصدار مستقر
        with:
          python-version: '3.10' # تحديد إصدار بايثون الثابت

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # تم تحديث السطر التالي ليشمل مكتبة ddgs و groq
          pip install requests feedparser beautifulsoup4 pillow ddgs groq

      - name: Run Main Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit Updated History
        # هذا الجزء يضمن حفظ سجل الروابط التي تم نشرها لمنع التكرار
        continue-on-error: true # يمنع توقف الـ workflow إذا فشل الـ commit (مثلاً لعدم وجود تغييرات)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git commit -m "Update posted history [skip ci]"
          git push
