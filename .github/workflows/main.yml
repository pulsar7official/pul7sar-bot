name: PUL7SAR Ultimate Sports Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-pulsar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests feedparser beautifulsoup4 pillow

      - name: Run PUL7SAR Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          import random
          from datetime import datetime
          from PIL import Image, ImageDraw
          from io import BytesIO

          groq_key = os.environ.get("GROQ_API_KEY", "").strip()
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          # 1. تحميل سجل التاريخ لمنع تكرار الروابط والمواضيع
          history_file = "posted_history.json"
          history_data = {"links": [], "titles": []}
          if os.path.exists(history_file):
              try:
                  with open(history_file, "r", encoding="utf-8") as f:
                      content = json.load(f)
                      if isinstance(content, list):
                          history_data["links"] = content
                      elif isinstance(content, dict):
                        history_data = content
              except:
                  pass

          posted_links = set(history_data.get("links", []))
          posted_titles = [t.lower() for t in history_data.get("titles", [])]

          # دالة للتحقق من تشابه العنوان مع أخبار سابقة لمنع تكرار الموضوع تماماً
          def is_topic_repeated(new_title):
              nt = new_title.lower()
              for pt in posted_titles:
                  # إذا تشابهت الكلمات الرئيسية بنسبة عالية نعتبره نفس الخبر
                  common_words = set(nt.split()).intersection(set(pt.split()))
                  if len(common_words) >= 3:
                      return True
              return False

          # 2. مصادر الأخبار
          rss_urls = [
              "https://www.skysports.com/rss/12040",
              "http://feeds.bbci.co.uk/sport/football/rss.xml",
              "https://www.goal.com/feeds/en/news"
          ]

          current_hour = datetime.utcnow().hour
          is_what_if_time = (current_hour == 18) # ساعة فقرة ماذا لو؟

          selected_article = None
          is_what_if_post = False

          if is_what_if_time:
              is_what_if_post = True
              print("🌙 وقت فقرة التاريخ البديل (ماذا لو؟) المسائية.")
          else:
              articles = []
              for url in rss_urls:
                  try:
                      feed = feedparser.parse(url)
                      for entry in feed.entries[:10]:
                          link = entry.get('link', entry.get('id', ''))
                          title = entry.get('title', '')
                          
                          if link in posted_links or is_topic_repeated(title):
                              continue  # تجاوز الخبر لتجنب التكرار

                          summary = entry.get('summary', title)
                          soup_clean = BeautifulSoup(summary, "html.parser")
                          clean_summary = soup_clean.get_text()

                          image_url = None
                          if 'media_content' in entry and len(entry.media_content) > 0:
                              image_url = entry.media_content[0].get('url')
                          elif 'enclosures' in entry and len(entry.enclosures) > 0:
                              image_url = entry.enclosures[0].get('href')

                          if not image_url or not image_url.startswith('http'):
                              image_url = "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1280&auto=format&fit=crop"

                          articles.append({
                              'title': title,
                              'summary': clean_summary,
                              'link': link,
                              'image': image_url
                          })
                  except Exception as e:
                      print(f"⚠️ خطأ في قراءة المصدر {url}: {e}")

              if articles:
                  selected_article = random.choice(articles)
                  posted_links.add(selected_article['link'])
                  posted_titles.append(selected_article['title'])
                  print(f"📰 الخبر المختار: {selected_article['title']}")
              else:
                  print("⚠️ لا توجد أخبار جديدة غير منشورة حالياً.")
                  exit(0)

          # 3. تحديد الألوان
          def get_design_color(text):
              t = text.lower()
              if any(k in t for k in ['milan', 'liverpool', 'arsenal', 'bayern', 'benfica', 'spain', 'morocco', 'portugal', 'man utd', 'manchester united']):
                  return "#E50914"
              elif any(k in t for k in ['real madrid', 'tottenham', 'spurs', 'germany', 'england']):
                  return "#FEA326"
              elif any(k in t for k in ['chelsea', 'inter', 'france', 'italy', 'psg', 'paris']):
                  return "#0055A5"
              elif any(k in t for k in ['man city', 'manchester city', 'napoli', 'argentina']):
                  return "#6CABDD"
              elif 'barcelona' in t or 'barca' in t:
                  return "#A50044"
              elif any(k in t for k in ['dortmund', 'al nassr', 'brazil']):
                  return "#FDE100"
              return "#FF1E38" # الأحمر الناري الأساسي لـ PUL7SAR

          # 4. صياغة النص مع منع الحروف الأجنبية والصينية تماماً
          groq_url = "https://api.groq.com/openai/v1/chat/completions"
          headers = {"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"}

          if is_what_if_post:
              prompt = """
              أنت محرر رياضي محترف في منصة PUL7SAR. اكتب فقرة تفاعلية مشوقة بعنوان "ماذا لو؟" عن سيناريو تاريخي في كرة القدم (فرصة ضائعة بنهائي، إصابة أثرت على مسيرة أسطورة مثل رونالدو أو نادال).
              - اكتب حصراً باللغة العربية الفصحى السليمة. ممنوع نهائياً استخدام أي حروف صينية أو يابانية أو غير عربية.
              - ابدأ بعنوان مثير يبدأ بـ ⏳ ماذا لو؟
              - اختم بسؤال تفاعلي للمتابعين، ووضع هاشتاقات عربية واضحة مع #PUL7SAR.
              """
              image_url = "https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1280&auto=format&fit=crop"
              team_color = "#FF1E38"
          else:
              prompt = f"""
              أنت محرر صحفي رياضي احترافي لمنصة PUL7SAR.
              تنبيه صارم جداً: اكتب حصراً بلغة عربية فصحى سليمة ودقيقة 100%. ممنوع منعاً باتاً كتابة أي حروف صينية أو يابانية أو روسية أو كلمات مكسورة أو حروف غريبة. استخدم مصطلحات صحيحة مثل (المدرب) أو (المدير الفني).
              
              الخبر الرياضي الخام:
              العنوان: {selected_article['title']}
              التفاصيل: {selected_article['summary']}

              قم بصياغة منشور رياضي مستقل وشيق يتحدث عن هذا الخبر فقط:
              - ابدأ بعنوان رئيسي جذاب ومثير.
              - اشرح تفاصيل الخبر بأسلوب ممتع ومختصر.
              - استخدم الإيموجيات الرياضية المناسبة.
              - أنهِ المنشور بهشتاجات عربية صحيحة مع هشتاج المنصة #PUL7SAR وتجنب أي هاشتاقات أجنبية غريبة.
              """
              image_url = selected_article['image']
              team_color = get_design_color(selected_article['title'] + " " + selected_article['summary'])

          payload = {
              "model": "llama-3.3-70b-versatile",
              "messages": [{"role": "user", "content": prompt}]
          }

          res = requests.post(groq_url, json=payload, headers=headers)
          if res.status_code != 200:
              raise Exception(f"❌ خطأ من Groq: {res.text}")

          raw_text = res.json()['choices'][0]['message']['content']

          # فلتر برامجي نهائي لحذف أي حروف صينية (CJK) أو يابانية أو سيريلية قد تسربت من الذكاء الاصطناعي
          clean_text = re.sub(r'[\u4e00-\u9fff\u3040-\u30ff\u0400-\u04ff]+', '', raw_text)

          # 5. معالجة الصورة والهوية البصرية
          final_image_path = "processed_image.jpg"
          try:
              img_res = requests.get(image_url, timeout=10)
              img = Image.open(BytesIO(img_res.content)).convert("RGB")
              
              img = img.resize((1280, 720))
              draw = ImageDraw.Draw(img)

              gradient = Image.new('RGBA', (1280, 200), (0,0,0,0))
              g_draw = ImageDraw.Draw(gradient)
              for y in range(200):
                  alpha = int((y / 200.0) * 180)
                  g_draw.line([(0, y), (1280, y)], fill=(0, 0, 0, alpha))
              img.paste(gradient, (0, 520), gradient)

              draw.rectangle([(0, 710), (1280, 720)], fill=team_color)

              draw.text((50, 40), "PUL", fill="white")
              draw.text((105, 40), "7", fill=team_color)
              draw.text((120, 40), "SAR", fill="white")
              
              draw.line([(100, 35), (108, 25), (114, 45), (122, 35)], fill=team_color, width=3)

              img.save(final_image_path)
          except Exception as e:
              print(f"⚠️ خطأ في معالجة الصورة: {e}")
              final_image_path = None

          # 6. النشر على تليجرام
          if final_image_path and os.path.exists(final_image_path):
              tele_url = f"https://api.telegram.org/bot{bot_token}/sendPhoto"
              with open(final_image_path, 'rb') as photo_file:
                  tele_payload = {"chat_id": chat_id, "caption": clean_text}
                  tele_res = requests.post(tele_url, data=tele_payload, files={'photo': photo_file})
          else:
              tele_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              tele_payload = {"chat_id": chat_id, "text": clean_text}
              tele_res = requests.post(tele_url, json=tele_payload)

          if tele_res.status_code == 200:
              print("🚀 تم النشر بنجاح وبدون تكرار أو حروف غريبة!")
              # حفظ السجل المحدث (آخر 100 رابط وعنوان)
              history_data["links"] = list(posted_links)[-100:]
              history_data["titles"] = posted_titles[-100:]
              with open(history_file, "w", encoding="utf-8") as f:
                  json.dump(history_data, f, ensure_ascii=False)
          else:
              raise Exception(f"❌ خطأ تليجرام: {tele_res.text}")
          EOF

      - name: Commit Updated History
        run: |
          git config --global user.name "PUL7SAR Bot"
          git config --global user.email "bot@pul7sar.internal"
          git add posted_history.json || true
          git commit -m "Update deduplication history [skip ci]" || true
          git push || true
