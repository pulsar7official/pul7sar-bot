name: PUL7SAR Telegram Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Packages
        run: |
          pip install requests

      - name: Generate Content & Post to Telegram
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests

          groq_key = os.environ.get("GROQ_API_KEY", "").strip()
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not groq_key:
              raise Exception("❌ GROQ_API_KEY غير موجود في GitHub Secrets!")

          # 1. طلب توليد النص الرياضي من Groq API
          groq_url = "https://api.groq.com/openai/v1/chat/completions"
          headers = {
              "Authorization": f"Bearer {groq_key}",
              "Content-Type": "application/json"
          }
          payload = {
              "model": "llama-3.3-70b-versatile",
              "messages": [{
                  "role": "user",
                  "content": "اكتب منشوراً رياضياً مشوقاً وقصيراً لمنصة PUL7SAR يغطي أبرز أخبار وتحديثات كرة القدم العالمية اليوم، مع استخدام التنسيق الجذاب والإيموجيات المناسبة للتليجرام."
              }]
          }

          print("🔄 جاري الاتصال بـ Groq API...")
          res = requests.post(groq_url, json=payload, headers=headers)

          if res.status_code != 200:
              print(f"❌ خطأ من Groq API ({res.status_code}): {res.text}")
              raise Exception(res.text)

          generated_text = res.json()['choices'][0]['message']['content']
          print("✅ تم توليد النص بنجاح!")

          # 2. الإرسال إلى التليجرام
          telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          tele_payload = {
              "chat_id": chat_id,
              "text": generated_text
          }

          tele_res = requests.post(telegram_url, json=tele_payload)
          if tele_res.status_code == 200:
              print("🚀 تم النشر بنجاح على قناة التليجرام!")
          else:
              print(f"❌ خطأ أجهزة التليجرام: {tele_res.text}")
              raise Exception(tele_res.text)
          EOF
