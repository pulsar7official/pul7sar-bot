name: Phase 18 First Genuine Golden Editorial v6 Fresh

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PHASE18_FIRST_GENUINE_GOLDEN_V6_FRESH to execute freshness-bound Candidate 1 on the immutable Phase 18 source"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase18-first-genuine-golden-v6-fresh
  cancel-in-progress: false

jobs:
  candidate-1-genuine-golden-v6-fresh:
    runs-on: [self-hosted, linux, x64, gpu, cuda, bf16, pul7sar-phase18]
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      PUL7SAR_PHASE18_COST_MODE: $0-local
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Require explicit immutable Phase 18 dispatch
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PHASE18_FIRST_GENUINE_GOLDEN_V6_FRESH"
          test "$DISPATCH_REF" = "refs/heads/phase18/story-intelligence"
          printf '%s' "$DISPATCH_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout immutable Phase 18 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reattach exact Phase 18 branch and prove main isolation
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          git checkout -B phase18/story-intelligence "$DISPATCH_SHA"
          test "$(git branch --show-current)" = "phase18/story-intelligence"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -f tools/phase18_run_first_genuine_golden_v6_canonical_fresh.py
          test -f tools/phase18_first_golden_freshness_guard.py
          test -f tools/phase18_capture_first_golden_runner_identity.py
          test -f tools/phase18_capture_approved_snapshot_inventory.py
          test -f tools/phase18_capture_zero_cost_network_guard_evidence.py
          test -f tools/phase18_bind_zero_cost_network_guard_to_review_bundle.py
          test -f tools/phase18_bind_first_genuine_golden_source_commit.py
          test -f tools/phase18_verify_first_genuine_golden_v6_source_bound_artifact.py
          test -f tools/phase18_verify_first_genuine_golden_v6_fresh_source_bound.py
          test -f tools/phase18_verify_first_genuine_golden_png_structure.py
          test -f tools/phase18_verify_first_genuine_golden_png_chunk_semantics.py
          test -f tools/phase18_bind_png_structure_to_review_bundle.py
          test -f tools/phase18_verify_first_genuine_golden_png_canonical_encoding.py
          test -f tools/phase18_bind_png_canonical_encoding_to_review_bundle.py
          test -f tools/phase18_verify_first_genuine_golden_v6_snapshot_bound.py
          test -f tools/phase18_package_first_genuine_golden_v6_review_bundle.py
          test -f tools/phase18_verify_first_genuine_golden_v6_review_bundle.py
          test -f tools/phase18_verify_first_golden_tracked_source_integrity.py
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          if git diff --name-only "$base"...HEAD | grep -qx 'main.py'; then
            echo "Unexpected main.py modification detected in Phase 18 diff." >&2
            exit 6
          fi

      - name: Capture immutable tracked source baseline before preflight
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_golden_tracked_source_integrity.py capture \
            --repo-root . \
            --expected-source-sha "$DISPATCH_SHA" \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-tracked-source-baseline.json

      - name: Prove zero-cost network guard is active before any model preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_capture_zero_cost_network_guard_evidence.py \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-zero-cost-network-guard.json

      - name: Record first-Golden execution blocker probe before CUDA preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_probe_first_golden_execution_blocker.py \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-execution-blocker-probe.json

      - name: Capture approved local model snapshot inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_capture_approved_snapshot_inventory.py \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-approved-snapshot-inventory.json

      - name: Capture immutable runner and CUDA identity evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_capture_first_golden_runner_identity.py \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-runner-identity.json

      - name: Prove CUDA native BF16 and offline-only execution without replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import torch
          if os.environ.get("PUL7SAR_PHASE18_COST_MODE") != "$0-local":
              raise SystemExit("First Genuine Golden v6 requires $0-local execution")
          if os.environ.get("HF_HUB_OFFLINE") != "1" or os.environ.get("TRANSFORMERS_OFFLINE") != "1":
              raise SystemExit("First Genuine Golden v6 requires local-cache-only model resolution")
          if not torch.cuda.is_available() or torch.version.cuda is None or torch.cuda.device_count() < 1:
              raise SystemExit("A real CUDA-enabled PyTorch runtime and CUDA device are required")
          if not torch.cuda.is_bf16_supported():
              raise SystemExit("Native BF16 support is required; refusing FP16/FP32 substitution")
          PY

      - name: Run freshness-bound canonical Candidate 1
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/phase18_run_first_genuine_golden_v6_canonical_fresh.py \
            --expected-commit "$DISPATCH_SHA" \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-resource-lock.json \
            --receipt output/phase18_gpu_smoke/first-genuine-golden-v6-canonical-attested-pre-gpu-receipt.json \
            --attestation output/phase18_gpu_smoke/first-genuine-golden-v6-canonical-attested-pre-gpu-attestation.json \
            --summary output/phase18_gpu_smoke/first-genuine-golden-v6-canonical-attested-pre-gpu-summary.json \
            --handoff output/phase18_gpu_smoke/first-genuine-golden-v6-canonical-gpu-handoff.json \
            --attempt-contract output/phase18_gpu_smoke/first-genuine-golden-v6-gpu-attempt-contract.json \
            --freshness-baseline output/phase18_gpu_smoke/first-genuine-golden-v6-freshness-baseline.json \
            --freshness-verification output/phase18_gpu_smoke/first-genuine-golden-v6-freshness-verification.json \
            > output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-wrapper-result.json

      - name: Replay freshness result before source binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-wrapper-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema") != "pul7sar-phase18-first-genuine-golden-v6-canonical-fresh-launch-v1":
              raise SystemExit("fresh wrapper schema drift")
          if payload.get("ready") is not True or payload.get("fresh_attempt_evidence") is not True:
              raise SystemExit("freshness-bound canonical attempt is not ready")
          if payload.get("canonical_generation_started") is not True:
              raise SystemExit("freshness-bound canonical attempt did not start generation")
          for field in ("authoritative_gate", "network_download_authorized", "generation_authorized", "publication_ready", "seeds_2_to_4_authorized"):
              if payload.get(field) is not False:
                  raise SystemExit(f"freshness wrapper authority drift: {field}")
          PY

      - name: Bind and replay exact source commit provenance
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/phase18_bind_first_genuine_golden_source_commit.py bind \
            output/phase18_gpu_smoke/first-genuine-golden-v6-resource-lock.json \
            output/phase18_gpu_smoke/first-genuine-golden-v6-source-binding.json \
            --repo-root .
          python tools/phase18_bind_first_genuine_golden_source_commit.py verify \
            output/phase18_gpu_smoke/first-genuine-golden-v6-source-binding.json \
            output/phase18_gpu_smoke/first-genuine-golden-v6-resource-lock.json \
            --expected-source-sha "$DISPATCH_SHA"
          python tools/phase18_verify_first_genuine_golden_v6_source_bound_artifact.py \
            output/phase18_gpu_smoke/first-genuine-golden-v6-resource-lock.json \
            --artifact-root . \
            --expected-source-sha "$DISPATCH_SHA" \
            > output/phase18_gpu_smoke/first-genuine-golden-v6-source-bound-replay.json

      - name: Bind execution, runner, fresh attempt, source provenance, and PNG bytes
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_genuine_golden_v6_fresh_source_bound.py \
            --execution-probe output/phase18_gpu_smoke/first-genuine-golden-v6-execution-blocker-probe.json \
            --runner-identity output/phase18_gpu_smoke/first-genuine-golden-v6-runner-identity.json \
            --fresh-wrapper output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-wrapper-result.json \
            --freshness-verification output/phase18_gpu_smoke/first-genuine-golden-v6-freshness-verification.json \
            --source-bound-replay output/phase18_gpu_smoke/first-genuine-golden-v6-source-bound-replay.json \
            --resource-lock output/phase18_gpu_smoke/first-genuine-golden-v6-resource-lock.json \
            --repo-root . \
            --expected-source-sha "$DISPATCH_SHA" \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-source-bound-manifest.json \
            > output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-source-bound-replay.json

      - name: Prove complete Candidate 1 PNG structure before review packaging
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_genuine_golden_png_structure.py \
            --manifest output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-source-bound-manifest.json \
            --repo-root . \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-png-structure.json

      - name: Prove Candidate 1 PNG chunk semantics before review packaging
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_genuine_golden_png_chunk_semantics.py \
            --structure output/phase18_gpu_smoke/first-genuine-golden-v6-png-structure.json \
            --repo-root . \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-png-chunk-semantics.json

      - name: Prove canonical RGB8 Candidate 1 PNG encoding before review packaging
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_genuine_golden_png_canonical_encoding.py \
            --structure output/phase18_gpu_smoke/first-genuine-golden-v6-png-structure.json \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-png-canonical-encoding.json

      - name: Replay and bind approved model snapshots and runtime after generation
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_genuine_golden_v6_snapshot_bound.py \
            --upstream-manifest output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-source-bound-manifest.json \
            --snapshot-inventory output/phase18_gpu_smoke/first-genuine-golden-v6-approved-snapshot-inventory.json \
            --execution-probe output/phase18_gpu_smoke/first-genuine-golden-v6-execution-blocker-probe.json \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-snapshot-bound-manifest.json \
            > output/phase18_gpu_smoke/first-genuine-golden-v6-snapshot-bound-replay.json

      - name: Package exact Golden v6 Candidate 1 review bundle
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_package_first_genuine_golden_v6_review_bundle.py \
            --fresh-manifest output/phase18_gpu_smoke/first-genuine-golden-v6-fresh-source-bound-manifest.json \
            --snapshot-manifest output/phase18_gpu_smoke/first-genuine-golden-v6-snapshot-bound-manifest.json \
            --repo-root . \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}

      - name: Bind zero-cost network guard evidence into exact review bundle
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_bind_zero_cost_network_guard_to_review_bundle.py bind \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --network-evidence output/phase18_gpu_smoke/first-genuine-golden-v6-zero-cost-network-guard.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Bind verified PNG structure evidence into exact review bundle
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_bind_png_structure_to_review_bundle.py bind \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --structure-evidence output/phase18_gpu_smoke/first-genuine-golden-v6-png-structure.json

      - name: Bind canonical RGB8 PNG evidence into exact review bundle
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_bind_png_canonical_encoding_to_review_bundle.py bind \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --canonical-evidence output/phase18_gpu_smoke/first-genuine-golden-v6-png-canonical-encoding.json

      - name: Replay exact Golden v6 review bundle before upload
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_genuine_golden_v6_review_bundle.py \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-review-bundle-replay.json

      - name: Replay zero-cost network guard binding before upload
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_bind_zero_cost_network_guard_to_review_bundle.py verify \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-zero-cost-network-review-binding.json

      - name: Replay PNG structure binding before upload
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_bind_png_structure_to_review_bundle.py verify \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-png-structure-review-binding.json

      - name: Replay canonical RGB8 PNG binding before upload
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python tools/phase18_bind_png_canonical_encoding_to_review_bundle.py verify \
            --bundle-dir output/phase18_golden_review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-png-canonical-review-binding.json

      - name: Replay immutable tracked source immediately before upload
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_golden_tracked_source_integrity.py verify \
            --repo-root . \
            --expected-source-sha "$DISPATCH_SHA" \
            --baseline output/phase18_gpu_smoke/first-genuine-golden-v6-tracked-source-baseline.json \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-tracked-source-verification.json

      - name: Upload exact Golden v6 Candidate 1 review bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase18-first-genuine-golden-v6-review-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: output/phase18_golden_review/${{ github.run_id }}-${{ github.run_attempt }}/**

      - name: Upload failed-attempt diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase18-first-genuine-golden-v6-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 3
          path: output/phase18_gpu_smoke/**