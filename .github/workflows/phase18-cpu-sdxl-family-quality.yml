name: Phase 18 CPU SDXL Hybrid Family Quality Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - phase18/original-visual-benchmark
    paths:
      - 'tools/phase18_cpu_sdxl_family_synthesis.py'
      - 'tools/phase18_build_sdxl_hybrid_candidate.py'
      - 'engine/intelligence/original_scene_prompt_profiles.py'
      - 'engine/intelligence/original_scene_archetype_profiles.py'
      - 'engine/intelligence/cross_family_visual_system.py'
      - 'engine/intelligence/pre_generation_scene_lock.py'
      - 'engine/intelligence/generation_prompt_budget.py'
      - 'engine/intelligence/hybrid_scene_contract.py'
      - 'engine/intelligence/hybrid_family_compositor.py'
      - 'engine/intelligence/brand_reference_renderer.py'
      - 'engine/intelligence/brand_embedded_master.py'
      - 'tests/test_phase18_hybrid_family_compositor.py'
      - 'tests/test_phase18_original_scene_archetype_profiles.py'
      - '.github/workflows/phase18-cpu-sdxl-family-quality.yml'

permissions:
  contents: read

jobs:
  synthesize-family:
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: transfer_signature
            archetype: threshold_arrival
          - family: result_statement
            archetype: club_duel_space
          - family: verified_subject_news
            archetype: portrait_depth
          - family: data_monument
            archetype: number_sculpture
          - family: event_editorial
            archetype: anticipation_tunnel
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify hybrid ownership and archetype coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python -m unittest -v \
            tests.test_phase18_hybrid_family_compositor \
            tests.test_phase18_original_scene_archetype_profiles
      - name: Install CPU SDXL runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install 'diffusers>=0.34,<0.37' 'transformers>=4.44,<5' accelerate safetensors Pillow
      - name: Generate archetype-aware family atmosphere candidate
        run: |
          python tools/phase18_cpu_sdxl_family_synthesis.py \
            --family '${{ matrix.family }}' \
            --archetype '${{ matrix.archetype }}' \
            --out-dir 'out/${{ matrix.family }}' \
            --width 512 --height 640 --steps 4
          test -s 'out/${{ matrix.family }}/${{ matrix.family }}.png'
          test -s 'out/${{ matrix.family }}/manifest.json'
      - name: Compose exact editorial hybrid
        run: |
          python tools/phase18_build_sdxl_hybrid_candidate.py \
            --family '${{ matrix.family }}' \
            --base 'out/${{ matrix.family }}/${{ matrix.family }}.png' \
            --out-dir 'out/${{ matrix.family }}'
          test -s 'out/${{ matrix.family }}/${{ matrix.family }}-hybrid.png'
          test -s 'out/${{ matrix.family }}/hybrid-manifest.json'
      - name: Verify synthesis and fail-closed hybrid manifests
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          family=os.environ['FAMILY']
          archetype=os.environ['ARCHETYPE']
          root=Path(f'out/{family}')
          m=json.loads((root/'manifest.json').read_text())
          h=json.loads((root/'hybrid-manifest.json').read_text())
          assert m['contract']=='pul7sar-sdxl-family-synthesis-v2-archetype-aware'
          assert m['family']==family
          assert m['archetype_id']==archetype
          assert m['sport_lock']=='association_football'
          assert m['publication_ready'] is False
          assert m['model']=='stabilityai/sdxl-turbo'
          assert len(m['prompt_budgets']) >= 1
          assert h['contract']=='pul7sar-hybrid-family-compositor-v2'
          assert h['family']==family
          assert h['exact_brand_used'] is True
          assert h['deterministic_facts_used'] is True
          assert h['fabricated_crest_used'] is False
          assert h['placeholder_used'] is False
          assert h['compositor_generated_text_used'] is False
          assert h['source_photo_used'] is False
          assert h['base_scene_semantic_verified'] is False
          assert h['base_scene_text_absence_verified'] is False
          assert h['base_scene_identity_absence_verified'] is False
          assert h['base_scene_geometry_absence_verified'] is False
          assert h['semantic_gate_required_before_publication'] is True
          assert h['publication_ready'] is False
          png=root/h['png']
          assert png.is_file()
          assert hashlib.sha256(png.read_bytes()).hexdigest()==h['png_sha256']
          PY
        env:
          FAMILY: ${{ matrix.family }}
          ARCHETYPE: ${{ matrix.archetype }}
      - uses: actions/upload-artifact@v7
        with:
          name: phase18-sdxl-hybrid-${{ matrix.family }}-${{ matrix.archetype }}
          path: out/${{ matrix.family }}/
          if-no-files-found: error
          retention-days: 7
