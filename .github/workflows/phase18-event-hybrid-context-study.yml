name: Phase 18 Event Hybrid Context Study

on:
  push:
    branches: ['phase18/**']
    paths:
      - 'engine/intelligence/event_editorial_study_renderer.py'
      - 'engine/intelligence/verified_context_surface.py'
      - 'engine/intelligence/event_editorial_composition.py'
      - 'engine/intelligence/adaptive_brand_overlay.py'
      - 'engine/intelligence/adaptive_brand_placement.py'
      - 'engine/intelligence/brand_reference_renderer.py'
      - 'engine/intelligence/brand_embedded_master.py'
      - 'engine/intelligence/platform_profiles.py'
      - 'tools/phase18_build_event_hybrid_context_study.py'
      - 'tests/test_phase18_event_editorial_study_renderer.py'
      - '.github/workflows/phase18-event-hybrid-context-study.yml'
  pull_request:
    paths:
      - 'engine/intelligence/event_editorial_study_renderer.py'
      - 'engine/intelligence/verified_context_surface.py'
      - 'engine/intelligence/event_editorial_composition.py'
      - 'engine/intelligence/adaptive_brand_overlay.py'
      - 'engine/intelligence/adaptive_brand_placement.py'
      - 'engine/intelligence/brand_reference_renderer.py'
      - 'engine/intelligence/brand_embedded_master.py'
      - 'engine/intelligence/platform_profiles.py'
      - 'tools/phase18_build_event_hybrid_context_study.py'
      - 'tests/test_phase18_event_editorial_study_renderer.py'
      - '.github/workflows/phase18-event-hybrid-context-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hybrid-context-study:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      CONTEXT_URL: https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Well_lit_soccer_stadium_%28Unsplash%29.jpg/1280px-Well_lit_soccer_stadium_%28Unsplash%29.jpg
      SOURCE_REFERENCE: https://commons.wikimedia.org/wiki/File:Well_lit_soccer_stadium_(Unsplash).jpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install CPU dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run event and context regressions
        run: |
          python -m unittest -v tests.test_phase18_verified_context_surface
          python -m unittest -v tests.test_phase18_event_editorial_study_renderer
      - name: Fetch CC0 photographic context fixture
        run: |
          mkdir -p output/phase18_event_hybrid_context_study/source
          curl --fail --location --retry 3 --silent --show-error "$CONTEXT_URL" \
            --output output/phase18_event_hybrid_context_study/source/context.jpg
          test -s output/phase18_event_hybrid_context_study/source/context.jpg
      - name: Build hybrid photographic event PNG
        run: |
          python tools/phase18_build_event_hybrid_context_study.py \
            --output-dir output/phase18_event_hybrid_context_study \
            --context-image output/phase18_event_hybrid_context_study/source/context.jpg \
            --source-reference "$SOURCE_REFERENCE"
      - name: Verify provenance and output contract
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('output/phase18_event_hybrid_context_study')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          png=root/m['png']
          source=root/'source/context.jpg'
          assert m['manifest_version']=='pul7sar-event-editorial-hybrid-context-v1'
          assert m['renderer_contract']=='pul7sar-event-editorial-study-renderer-v1-premium-anchor'
          assert m['context_contract']=='pul7sar-verified-context-surface-v1'
          assert m['photographic_context_used'] is True
          assert m['context_rights_basis']=='public_domain'
          assert m['person_used'] is False
          assert m['generator_used'] is False and m['network_used_by_renderer'] is False
          assert m['study_only'] is True and m['publication_ready'] is False
          assert hashlib.sha256(source.read_bytes()).hexdigest()==m['context_asset_sha256']
          assert hashlib.sha256(png.read_bytes()).hexdigest()==m['png_sha256']
          assert png.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('Premium hybrid photographic Event Editorial study PASS')
          PY
      - name: Remove downloaded source from artifact payload
        run: rm -rf output/phase18_event_hybrid_context_study/source
      - name: Upload hybrid context study
        uses: actions/upload-artifact@v7
        with:
          name: 'PUL7SAR-event-hybrid-context-${{ github.sha }}'
          path: output/phase18_event_hybrid_context_study/
          if-no-files-found: error
          retention-days: 14
