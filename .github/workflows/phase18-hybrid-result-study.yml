name: Phase 18 Hybrid Result Pixel Study

on:
  workflow_dispatch:
  push:
    branches:
      - phase18/original-visual-benchmark
    paths:
      - 'tools/phase18_cpu_cross_family_synthesis.py'
      - 'tools/phase18_compose_hybrid_result.py'
      - 'engine/intelligence/original_scene_prompt_profiles.py'
      - 'engine/intelligence/pre_generation_scene_lock.py'
      - 'engine/intelligence/generation_prompt_budget.py'
      - 'engine/intelligence/generated_base_provenance.py'
      - 'engine/intelligence/hybrid_final_composer.py'
      - 'engine/intelligence/hybrid_pixel_composer.py'
      - '.github/workflows/phase18-hybrid-result-study.yml'

permissions:
  contents: read

jobs:
  build-hybrid-result-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install 'diffusers>=0.34,<0.37' 'transformers>=4.44,<5' accelerate safetensors Pillow
      - name: Generate locked family bases
        run: python tools/phase18_cpu_cross_family_synthesis.py --out-dir out/base --width 512 --height 640 --steps 4
      - name: Compose exact result layer over provenance-verified base
        run: |
          python tools/phase18_compose_hybrid_result.py \
            --base out/base/result_statement.png \
            --base-manifest out/base/manifest.json \
            --output out/hybrid/result_hybrid_study.jpg \
            --manifest out/hybrid/manifest.json
          test -s out/hybrid/result_hybrid_study.jpg
          test -s out/hybrid/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('out/hybrid/manifest.json').read_text())
          assert m['contract']=='pul7sar-hybrid-result-pixel-study-v2-provenance'
          assert m['generated_base_used'] is True
          assert m['provenance_verified'] is True
          assert m['sport_lock']=='association_football'
          assert m['prompt_token_count'] <= m['prompt_usable_limit']
          assert m['brand_applied'] is False
          assert m['fabricated_crest_used'] is False
          assert m['publication_ready'] is False
          assert m['human_visual_review_required'] is True
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: phase18-hybrid-result-pixel-study
          path: out/hybrid/
          if-no-files-found: error
          retention-days: 3
