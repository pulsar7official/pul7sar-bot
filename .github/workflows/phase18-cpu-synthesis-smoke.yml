name: Phase 18 CPU Original Scene Synthesis Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - phase18/original-visual-benchmark
    paths:
      - 'tools/phase18_cpu_original_scene_synthesis.py'
      - '.github/workflows/phase18-cpu-synthesis-smoke.yml'

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU synthesis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install 'diffusers>=0.34,<0.37' 'transformers>=4.44,<5' accelerate safetensors Pillow
      - name: Generate original unbranded atmosphere
        run: |
          python tools/phase18_cpu_original_scene_synthesis.py --output out/cpu-original-atmosphere.png --seed 181818 --width 512 --height 640 --steps 1
          test -s out/cpu-original-atmosphere.png
          test -s out/cpu-original-atmosphere.json
      - uses: actions/upload-artifact@v7
        with:
          name: phase18-cpu-original-synthesis-smoke
          path: out/
          if-no-files-found: error
          retention-days: 3
