name: Phase 18 First Golden Review

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PHASE18_FIRST_GOLDEN_REVIEW to execute Candidate 1 through the runtime-locked sealed review path"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase18-first-golden-review
  cancel-in-progress: false

jobs:
  candidate-1-sealed-review:
    # Deliberately self-hosted. Never fall back to a paid hosted GPU runner.
    runs-on: [self-hosted, linux, x64, gpu, cuda, bf16, pul7sar-phase18]
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      PUL7SAR_PHASE18_COST_MODE: $0-local

    steps:
      - name: Require explicit first-Golden confirmation and Phase 18 dispatch ref
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "RUN_PHASE18_FIRST_GOLDEN_REVIEW" ]; then
            echo "Refusing first-Golden execution: confirmation token mismatch." >&2
            exit 2
          fi
          if [ "$DISPATCH_REF" != "refs/heads/phase18/story-intelligence" ]; then
            echo "Refusing first-Golden execution outside phase18/story-intelligence: $DISPATCH_REF" >&2
            exit 3
          fi
          if ! printf '%s' "$DISPATCH_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refusing first-Golden execution: invalid immutable dispatch SHA." >&2
            exit 4
          fi

      - name: Checkout immutable dispatched Phase 18 commit with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove immutable checkout, attach exact Phase 18 branch, and verify isolation
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          git checkout -B phase18/story-intelligence "$DISPATCH_SHA"
          test "$(git branch --show-current)" = "phase18/story-intelligence"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"

          test -f tools/phase18_colab_first_golden_runtime_locked.py
          test -f tools/phase18_colab_first_golden_bootstrap.py
          test -f tools/phase18_colab_first_golden_review_sealed.py
          test -f tools/phase18_first_png_original_scene.py
          test -f tools/phase18_qualify_gpu_host.py
          test -f tools/phase18_preflight_flux2_offload.py
          test -f engine/intelligence/flux2_offload_capability.py
          test -f engine/intelligence/generation_runtime_fingerprint.py
          test -f engine/intelligence/golden_original_scene_admission.py
          test -f engine/intelligence/first_golden_review_packet_integrity.py

          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git merge-base origin/main HEAD)"
          if [ -z "$base" ]; then
            echo "Unable to establish merge-base with main; refusing GPU execution." >&2
            exit 5
          fi
          if git diff --name-only "$base"...HEAD | grep -qx 'main.py'; then
            echo "Unexpected main.py modification detected in Phase 18 diff." >&2
            exit 6
          fi

      - name: Prove CUDA-enabled PyTorch exists without replacing it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import torch
          payload = {
              "torch": torch.__version__,
              "cuda_available": bool(torch.cuda.is_available()),
              "cuda_version": torch.version.cuda,
              "device_count": int(torch.cuda.device_count()) if torch.cuda.is_available() else 0,
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not torch.cuda.is_available():
              raise SystemExit("CUDA-enabled PyTorch is required; refusing to install or replace PyTorch automatically")
          PY

      - name: Run runtime-locked Candidate 1 pipeline through sealed human-review staging
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_colab_first_golden_runtime_locked.py \
            --worker-id github-self-hosted-first-golden-review-01 \
            --timeout-seconds 1800 \
            --output output/phase18_gpu_smoke/first-golden-runtime-locked.json

      - name: Replay runtime fingerprint, bootstrap evidence, and exact review PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          runtime_path = root / "output/phase18_gpu_smoke/first-golden-runtime-locked.json"
          if not runtime_path.is_file():
              raise SystemExit("first-Golden runtime-lock receipt missing")
          runtime = json.loads(runtime_path.read_text(encoding="utf-8"))
          if runtime.get("schema") != "pul7sar-first-golden-runtime-lock-v1":
              raise SystemExit("unexpected first-Golden runtime-lock schema")
          if runtime.get("status") != "FIRST_GOLDEN_RUNTIME_LOCK_VERIFIED":
              raise SystemExit("first-Golden runtime lock not verified")
          if runtime.get("branch") != "phase18/story-intelligence" or runtime.get("candidate") != 1:
              raise SystemExit("first-Golden runtime-lock identity drift")
          if runtime.get("cost_mode") != "$0-local":
              raise SystemExit("first-Golden runtime lock escaped zero-cost mode")
          if runtime.get("runtime_stable_across_generation") is not True:
              raise SystemExit("first-Golden runtime stability was not proven")
          runtime_sha = runtime.get("runtime_fingerprint_sha256")
          if not isinstance(runtime_sha, str) or len(runtime_sha) != 64:
              raise SystemExit("first-Golden runtime fingerprint SHA missing")
          for field in ("human_visual_review_approved", "golden_quality_approved", "publication_ready", "seeds_2_to_4_authorized"):
              if runtime.get(field) is not False:
                  raise SystemExit(f"first-Golden runtime lock illegally changed gate: {field}")

          def inside_repo(value: str) -> Path:
              path = Path(value)
              if not path.is_absolute():
                  path = root / path
              path = path.resolve()
              if path != root and root not in path.parents:
                  raise SystemExit(f"evidence path escaped repository: {path}")
              return path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          runtime_evidence = runtime.get("evidence")
          if not isinstance(runtime_evidence, dict) or set(runtime_evidence) != {
              "runtime_fingerprint_pre",
              "runtime_fingerprint_post",
              "strict_bootstrap",
          }:
              raise SystemExit("first-Golden runtime-lock evidence set is incomplete")
          for label, record in runtime_evidence.items():
              if not isinstance(record, dict):
                  raise SystemExit(f"invalid runtime-lock evidence record: {label}")
              path = inside_repo(str(record.get("path", "")))
              if not path.is_file():
                  raise SystemExit(f"runtime-lock evidence file missing: {label}")
              if sha256(path) != record.get("sha256") or path.stat().st_size != record.get("bytes"):
                  raise SystemExit(f"runtime-lock evidence replay mismatch: {label}")

          for label in ("runtime_fingerprint_pre", "runtime_fingerprint_post"):
              path = inside_repo(str(runtime_evidence[label]["path"]))
              fingerprint = json.loads(path.read_text(encoding="utf-8"))
              if fingerprint.get("schema") != "pul7sar-generation-runtime-fingerprint-v1":
                  raise SystemExit(f"unexpected runtime fingerprint schema: {label}")
              if fingerprint.get("runtime_fingerprint_sha256") != runtime_sha:
                  raise SystemExit(f"runtime fingerprint digest drift: {label}")
              if fingerprint.get("cost_mode") != "$0-local":
                  raise SystemExit(f"runtime fingerprint cost-mode drift: {label}")
              for field in ("generation_authorized", "queue_mutated", "png_created", "semantic_approved", "golden_quality_approved", "publication_ready"):
                  if fingerprint.get(field) is not False:
                      raise SystemExit(f"runtime fingerprint authority drift: {label}:{field}")

          receipt_path = inside_repo(str(runtime_evidence["strict_bootstrap"]["path"]))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("schema") != "pul7sar-first-golden-colab-bootstrap-v5":
              raise SystemExit("unexpected first-Golden bootstrap schema")
          if receipt.get("status") != "FIRST_GOLDEN_COLAB_REVIEW_PACKET_READY":
              raise SystemExit("first-Golden bootstrap did not reach sealed review readiness")
          if receipt.get("branch") != "phase18/story-intelligence" or receipt.get("candidate") != 1:
              raise SystemExit("first-Golden bootstrap identity drift")
          if receipt.get("cost_mode") != "$0-local":
              raise SystemExit("first-Golden bootstrap escaped zero-cost mode")
          if receipt.get("gpu_host_eligible") is not True or receipt.get("native_bf16_proven") is not True:
              raise SystemExit("first-Golden GPU host/native BF16 not proven")
          if receipt.get("live_free_vram_proven") is not True:
              raise SystemExit("first-Golden live free VRAM was not proven")
          if receipt.get("flux2_safe_offload_proven") is not True:
              raise SystemExit("first-Golden safe FLUX offload path was not proven")
          if receipt.get("flux2_safe_offload_mode") not in {"sequential_cpu", "model_cpu"}:
              raise SystemExit("first-Golden safe FLUX offload mode missing")
          free_vram = receipt.get("gpu_free_vram_gb")
          required_vram = receipt.get("required_vram_gb")
          if not isinstance(free_vram, (int, float)) or isinstance(free_vram, bool):
              raise SystemExit("first-Golden live free VRAM value missing")
          if not isinstance(required_vram, (int, float)) or isinstance(required_vram, bool) or float(free_vram) < float(required_vram):
              raise SystemExit("first-Golden live free VRAM is below required model floor")
          if receipt.get("semantic_runtime_ready") is not True or receipt.get("semantic_model_ready") is not True:
              raise SystemExit("first-Golden semantic runtime/model not proven")
          if receipt.get("human_visual_review_required") is not True:
              raise SystemExit("human visual review must remain required")
          if receipt.get("automatic_selection_performed") is not False:
              raise SystemExit("automatic visual selection is forbidden")
          for field in ("human_visual_review_approved", "golden_quality_approved", "publication_ready", "seeds_2_to_4_authorized"):
              if receipt.get(field) is not False:
                  raise SystemExit(f"first-Golden bootstrap illegally changed gate: {field}")

          evidence = receipt.get("bootstrap_evidence")
          if not isinstance(evidence, dict) or set(evidence) != {
              "repository_integrity",
              "gpu_host_qualification",
              "flux2_offload_preflight",
              "first_golden_cache_budget",
              "qwen_model_cache",
              "sealed_review_receipt",
          }:
              raise SystemExit("first-Golden bootstrap evidence set is incomplete")
          for label, record in evidence.items():
              if not isinstance(record, dict):
                  raise SystemExit(f"invalid evidence record: {label}")
              path = inside_repo(str(record.get("path", "")))
              if not path.is_file():
                  raise SystemExit(f"evidence file missing: {label}")
              if sha256(path) != record.get("sha256") or path.stat().st_size != record.get("bytes"):
                  raise SystemExit(f"evidence replay mismatch: {label}")

          host_record = evidence["gpu_host_qualification"]
          host_path = inside_repo(str(host_record["path"]))
          host = json.loads(host_path.read_text(encoding="utf-8"))
          if host.get("eligible") is not True or host.get("bf16_supported") is not True:
              raise SystemExit("GPU host qualification evidence is not Golden-eligible")
          if host.get("model_id") != "black-forest-labs/FLUX.2-klein-4B" or host.get("cost_mode") != "$0-local":
              raise SystemExit("GPU host qualification model/cost drift")
          if host.get("runtime_kind") != "local_cuda" or host.get("cuda_available") is not True:
              raise SystemExit("GPU host qualification CUDA drift")
          host_free = host.get("gpu_free_vram_gb")
          host_required = host.get("required_vram_gb")
          if not isinstance(host_free, (int, float)) or isinstance(host_free, bool):
              raise SystemExit("GPU host live free VRAM evidence missing")
          if not isinstance(host_required, (int, float)) or isinstance(host_required, bool) or float(host_free) < float(host_required):
              raise SystemExit("GPU host live free VRAM evidence below required floor")
          policy = host.get("policy")
          if not isinstance(policy, dict) or policy.get("requires_live_free_vram") is not True:
              raise SystemExit("GPU host live free VRAM policy drift")

          offload_record = evidence["flux2_offload_preflight"]
          offload_path = inside_repo(str(offload_record["path"]))
          offload = json.loads(offload_path.read_text(encoding="utf-8"))
          if offload.get("schema") != "pul7sar-phase18-flux2-offload-preflight-v1" or offload.get("ready") is not True:
              raise SystemExit("FLUX offload preflight evidence not ready")
          if offload.get("model_id") != "black-forest-labs/FLUX.2-klein-4B" or offload.get("cost_mode") != "$0-local":
              raise SystemExit("FLUX offload preflight identity/cost drift")
          if offload.get("pipeline_available") is not True:
              raise SystemExit("FLUX pipeline capability not proven")
          selected = offload.get("selected_safe_mode")
          if selected != receipt.get("flux2_safe_offload_mode"):
              raise SystemExit("FLUX offload mode binding drift")
          host_total = host.get("gpu_vram_gb")
          offload_total = offload.get("gpu_vram_gb")
          if not isinstance(host_total, (int, float)) or isinstance(host_total, bool):
              raise SystemExit("GPU host total VRAM evidence missing")
          if not isinstance(offload_total, (int, float)) or isinstance(offload_total, bool) or abs(float(host_total) - float(offload_total)) > 0.01:
              raise SystemExit("FLUX offload/host VRAM binding drift")
          floor = offload.get("model_offload_minimum_total_vram_gb")
          if not isinstance(floor, (int, float)) or isinstance(floor, bool) or float(floor) <= 0:
              raise SystemExit("FLUX model-offload safety floor missing")
          if float(host_total) <= float(floor) and selected != "sequential_cpu":
              raise SystemExit("low-VRAM host is not locked to sequential CPU offload")
          for field in ("model_loaded", "downloads_performed", "generation_authorized", "queue_mutated", "png_created", "semantic_approved", "golden_quality_approved", "publication_ready"):
              if offload.get(field) is not False:
                  raise SystemExit(f"FLUX offload preflight authority drift: {field}")

          for path_field, sha_field in (
              ("review_base_png", "review_base_png_sha256"),
              ("review_hybrid_png", "review_hybrid_png_sha256"),
          ):
              png = inside_repo(str(runtime.get(path_field, "")))
              if not png.is_file() or png.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"review PNG missing or invalid: {path_field}")
              if sha256(png) != runtime.get(sha_field):
                  raise SystemExit(f"review PNG SHA mismatch: {path_field}")
              if str(runtime.get(path_field)) != str(receipt.get(path_field)) or runtime.get(sha_field) != receipt.get(sha_field):
                  raise SystemExit(f"runtime/bootstrap review PNG binding drift: {path_field}")

          print(json.dumps({
              "status": "FIRST_GOLDEN_RUNTIME_AND_REVIEW_ARTIFACT_REPLAY_VERIFIED",
              "candidate": 1,
              "runtime_fingerprint_sha256": runtime_sha,
              "publication_ready": False,
              "seeds_2_to_4_authorized": False,
              "review_base_png": runtime["review_base_png"],
              "review_hybrid_png": runtime["review_hybrid_png"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload runtime-locked sealed Candidate 1 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-first-golden-review-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/phase18_gpu_smoke/**
            output/phase18_gpu_host/**
            output/phase18_colab/**
            output/phase18_visual_proof/**
            output/phase18_generated/**
            output/phase18_worker_telemetry/**
            output/phase18_generation_queue/**
            output/phase18_handoffs/golden-batch/**
