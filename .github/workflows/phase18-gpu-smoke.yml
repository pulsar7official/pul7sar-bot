name: Phase 18 GPU Golden Smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PHASE18_GOLDEN_GPU to execute the locked candidate-1 GPU smoke"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase18-golden-gpu-smoke
  cancel-in-progress: false

jobs:
  first-real-png:
    # Deliberately self-hosted. This workflow must never silently consume a paid
    # hosted GPU runner. Attach these labels only to a CUDA/BF16-capable PUL7SAR host.
    runs-on: [self-hosted, linux, x64, gpu, cuda, bf16, pul7sar-phase18]
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      PUL7SAR_PHASE18_COST_MODE: $0-local

    steps:
      - name: Require explicit GPU execution confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "RUN_PHASE18_GOLDEN_GPU" ]; then
            echo "Refusing GPU execution: confirmation token mismatch." >&2
            exit 2
          fi

      - name: Checkout Phase 18 branch only
        uses: actions/checkout@v4
        with:
          ref: phase18/story-intelligence
          fetch-depth: 1

      - name: Prove branch isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "phase18/story-intelligence"
          test -f engine/intelligence/golden_smoke.py
          test -f engine/intelligence/golden_evidence_bundle.py
          test -f engine/intelligence/pre_gpu_repository_integrity.py
          test -f engine/intelligence/first_golden_cache_budget.py
          test -f engine/intelligence/first_png_provenance_postflight.py
          test -f engine/intelligence/first_png_hybrid_handoff.py
          test -f tools/phase18_first_png.py
          test -f tools/phase18_preflight_repository_integrity.py
          test -f tools/phase18_preflight_first_golden_cache_budget.py
          test -f tools/phase18_preflight_semantic_gpu.py
          test -f tools/phase18_prefetch_qwen.py
          test -f tools/phase18_prefetch_flux2.py
          test -f tools/phase18_verify_first_png_provenance.py
          test -f tools/phase18_build_first_png_hybrid_handoff.py
          test -f tools/phase18_continue_hybrid_from_first_png.py
          test -f tools/phase18_build_gpu_evidence_manifest.py
          test -f tools/phase18_verify_gpu_evidence_manifest.py
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -qx 'main.py'; then
            echo "Unexpected main.py modification detected in Phase 18 diff." >&2
            exit 3
          fi

      - name: Prove CPU repository and reference integrity before GPU work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_preflight_repository_integrity.py \
            --output output/phase18_gpu_smoke/repository-integrity.json \
            | tee output/phase18_gpu_smoke/repository-integrity-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("output/phase18_gpu_smoke/repository-integrity.json").read_text(encoding="utf-8"))
          if payload.get("schema") != "pul7sar-phase18-pre-gpu-repository-integrity-v1":
              raise SystemExit("unexpected pre-GPU repository-integrity schema")
          if payload.get("branch") != "phase18/story-intelligence":
              raise SystemExit("repository integrity escaped the protected Phase 18 branch")
          if payload.get("ready") is not True or payload.get("blockers") != []:
              raise SystemExit("repository/reference integrity must pass before GPU work")
          if payload.get("cost_mode") != "$0-local":
              raise SystemExit("repository integrity escaped the Phase 18 zero-cost mode")
          if payload.get("compact_brand_member_integrity_pinned") is not True:
              raise SystemExit("compact reference member integrity is not pinned")
          if payload.get("compact_brand_self_contained") is not True:
              raise SystemExit("compact reference master is not self-contained")
          if payload.get("compact_brand_study_only") is not True:
              raise SystemExit("compact reference master illegally gained publication authority")
          if payload.get("legacy_transport_authoritative") is not False:
              raise SystemExit("legacy truncated brand transport became authoritative")
          for field in ("network_required", "gpu_required", "generation_authorized", "queue_mutated", "png_created", "publication_ready"):
              if payload.get(field) is not False:
                  raise SystemExit(f"repository preflight illegally changed gate: {field}")
          PY

      - name: Prove CUDA-enabled PyTorch exists before dependency installation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import torch
          payload = {
              "torch": torch.__version__,
              "cuda_available": bool(torch.cuda.is_available()),
              "cuda_version": torch.version.cuda,
              "device_count": int(torch.cuda.device_count()) if torch.cuda.is_available() else 0,
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not torch.cuda.is_available():
              raise SystemExit("CUDA-enabled PyTorch is required; refusing to replace/install PyTorch automatically")
          PY

      - name: Install Phase 18 GPU-side optional dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-phase18-gpu.txt

      - name: Prove combined Qwen and FLUX cache headroom before model downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_preflight_first_golden_cache_budget.py \
            --receipt output/phase18_gpu_smoke/first-golden-cache-budget.json \
            | tee output/phase18_gpu_smoke/first-golden-cache-budget-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("output/phase18_gpu_smoke/first-golden-cache-budget.json").read_text(encoding="utf-8"))
          if payload.get("schema") != "pul7sar-first-golden-cache-budget-v1":
              raise SystemExit("unexpected first-Golden shared cache-budget schema")
          if payload.get("branch") != "phase18/story-intelligence":
              raise SystemExit("first-Golden cache budget escaped the protected Phase 18 branch")
          if payload.get("cost_mode") != "$0-local":
              raise SystemExit("first-Golden cache budget escaped zero-cost mode")
          if payload.get("qwen_model_id") != "Qwen/Qwen2.5-VL-3B-Instruct":
              raise SystemExit("unexpected Qwen model in first-Golden cache budget")
          if payload.get("flux_model_id") != "black-forest-labs/FLUX.2-klein-4B":
              raise SystemExit("unexpected FLUX model in first-Golden cache budget")
          if payload.get("ready") is not True or payload.get("downloads_performed") is not False:
              raise SystemExit("shared cache budget must prove readiness without downloading models")
          budget = payload.get("budget", {})
          if budget.get("eligible") is not True or budget.get("reasons") not in ([], ()): 
              raise SystemExit("combined Qwen + FLUX shared cache headroom is not eligible")
          if float(budget.get("combined_minimum_free_gib", -1)) < 0:
              raise SystemExit("invalid combined cache minimum")
          for field in ("generation_authorized", "queue_mutated", "png_created", "publication_ready"):
              if payload.get(field) is not False:
                  raise SystemExit(f"cache-budget preflight illegally changed gate: {field}")
          PY

      - name: Prove semantic runtime and exact Qwen snapshot before FLUX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_preflight_semantic_gpu.py \
            --qwen-cache-receipt output/phase18_gpu_smoke/qwen-model-cache.json \
            --output output/phase18_gpu_smoke/semantic-preflight.json \
            | tee output/phase18_gpu_smoke/semantic-preflight-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("output/phase18_gpu_smoke/semantic-preflight.json").read_text(encoding="utf-8"))
          if payload.get("schema") != "pul7sar-phase18-semantic-gpu-preflight-v2":
              raise SystemExit("unexpected semantic GPU preflight schema")
          if payload.get("branch") != "phase18/story-intelligence":
              raise SystemExit("semantic preflight escaped the protected Phase 18 branch")
          if payload.get("model_id") != "Qwen/Qwen2.5-VL-3B-Instruct":
              raise SystemExit("unexpected Qwen snapshot in semantic preflight")
          if payload.get("cost_mode") != "$0-local":
              raise SystemExit("semantic preflight escaped the Phase 18 zero-cost mode")
          if payload.get("semantic_runtime_ready") is not True or payload.get("semantic_model_ready") is not True:
              raise SystemExit("semantic runtime/model must be ready before FLUX")
          if payload.get("cuda_available") is not True:
              raise SystemExit("semantic preflight did not prove CUDA availability")
          for field in ("generation_authorized", "queue_mutated", "png_created", "publication_ready"):
              if payload.get(field) is not False:
                  raise SystemExit(f"semantic preflight illegally changed gate: {field}")
          PY

      - name: Prove and cache the exact approved FLUX model snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_prefetch_flux2.py \
            --receipt output/phase18_gpu_smoke/model-cache.json \
            | tee output/phase18_gpu_smoke/model-cache-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("output/phase18_gpu_smoke/model-cache.json").read_text(encoding="utf-8"))
          if payload.get("ready") is not True:
              raise SystemExit("approved FLUX model cache is not ready")
          if payload.get("model_id") != "black-forest-labs/FLUX.2-klein-4B":
              raise SystemExit("unexpected model snapshot in Phase 18 cache receipt")
          if payload.get("cost_mode") != "$0-local":
              raise SystemExit("model prefetch escaped the Phase 18 zero-cost execution mode")
          PY

      - name: Record model-specific Golden readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_local_readiness.py | tee output/phase18_gpu_smoke/readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("output/phase18_gpu_smoke/readiness.json").read_text(encoding="utf-8"))
          if p.get("golden_generation_ready") is not True:
              raise SystemExit("golden_generation_ready is not true")
          if p.get("recommended_dtype") not in {"bfloat16", "bf16"}:
              raise SystemExit("Golden smoke requires proven BF16 readiness")
          PY

      - name: Generate first genuine locked Golden PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/phase18_gpu_smoke
          python tools/phase18_first_png.py \
            --worker-id github-self-hosted-golden-smoke-01 \
            --timeout-seconds 1800 \
            | tee output/phase18_gpu_smoke/first-png-result.json

      - name: Verify a real PNG exists and publication remains gated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("output/phase18_gpu_smoke/first-png-result.json").read_text(encoding="utf-8"))
          if result.get("publication_ready") is not False:
              raise SystemExit("GPU generation must not self-authorize publication")
          png = Path(result["png"])
          if not png.is_file() or png.suffix.lower() != ".png":
              raise SystemExit(f"Real PNG missing: {png}")
          sig = png.read_bytes()[:8]
          if sig != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Result file is not a valid PNG signature")
          print(json.dumps({"png": str(png), "bytes": png.stat().st_size}, indent=2))
          PY

      - name: Replay first-PNG executor and proof provenance before evidence sealing
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_verify_first_png_provenance.py \
            --output output/phase18_gpu_smoke/first-png-provenance-postflight.json \
            | tee output/phase18_gpu_smoke/first-png-provenance-postflight-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("output/phase18_gpu_smoke/first-png-provenance-postflight.json").read_text(encoding="utf-8"))
          if receipt.get("status") != "FIRST_GOLDEN_PNG_PROVENANCE_POSTFLIGHT_VERIFIED":
              raise SystemExit("first-PNG provenance postflight did not verify")
          if receipt.get("candidate") != 1:
              raise SystemExit("first-PNG provenance escaped Candidate 1")
          if receipt.get("cost_mode") != "$0-local":
              raise SystemExit("first-PNG provenance escaped zero-cost mode")
          if receipt.get("resolved_dtype") not in {"bfloat16", "bf16"}:
              raise SystemExit("first-PNG provenance did not replay BF16 execution")
          for field in ("semantic_approved", "golden_quality_approved", "publication_ready"):
              if receipt.get(field) is not False:
                  raise SystemExit(f"provenance postflight illegally changed gate: {field}")
          PY

      - name: Bridge proven Candidate 1 bytes into the Hybrid v5 semantic path
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_build_first_png_hybrid_handoff.py \
            --output output/phase18_colab/latest.json \
            | tee output/phase18_gpu_smoke/first-png-hybrid-handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          handoff = json.loads(Path("output/phase18_gpu_smoke/first-png-hybrid-handoff.json").read_text(encoding="utf-8"))
          if handoff.get("status") != "FIRST_GOLDEN_PNG_HYBRID_HANDOFF_READY":
              raise SystemExit("first-PNG Hybrid v5 handoff is not ready")
          if handoff.get("candidate") != 1:
              raise SystemExit("Hybrid handoff escaped Candidate 1")
          if handoff.get("manifest_version") != "pul7sar-golden-batch-v5":
              raise SystemExit("Hybrid handoff escaped Golden v5")
          if handoff.get("resolved_dtype") != "bfloat16" or handoff.get("cost_mode") != "$0-local":
              raise SystemExit("Hybrid handoff lost BF16 or zero-cost provenance")
          if handoff.get("hybrid_surface_replacement_required") is not True:
              raise SystemExit("Hybrid handoff lost deterministic surface ownership")
          for field in ("semantic_layer_gate_approved", "hybrid_semantic_review_approved", "golden_quality_approved", "publication_ready"):
              if handoff.get(field) is not False:
                  raise SystemExit(f"Hybrid handoff illegally changed gate: {field}")
          PY

      - name: Continue the proven PNG through strict Base and Hybrid semantic QA
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_continue_hybrid_from_first_png.py \
            --candidate 1 \
            --handoff output/phase18_colab/latest.json \
            --output output/phase18_gpu_smoke/hybrid-semantic-continuation.json \
            | tee output/phase18_gpu_smoke/hybrid-semantic-continuation-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("output/phase18_gpu_smoke/hybrid-semantic-continuation.json").read_text(encoding="utf-8"))
          if receipt.get("status") != "FIRST_GOLDEN_HYBRID_SEMANTIC_PROOF_READY":
              raise SystemExit("strict Hybrid semantic continuation did not complete")
          if receipt.get("candidate") != 1 or receipt.get("manifest_version") != "pul7sar-golden-batch-v5":
              raise SystemExit("Hybrid semantic continuation escaped Candidate 1 or Golden v5")
          if receipt.get("semantic_layer_gate_approved") is not True:
              raise SystemExit("Base semantic/layer ownership did not approve")
          if receipt.get("hybrid_semantic_review_approved") is not True:
              raise SystemExit("HYBRID_SURFACE semantic/alignment review did not approve")
          if receipt.get("artifact_integrity", {}).get("valid") is not True:
              raise SystemExit("deterministic hybrid artifact integrity did not verify")
          hybrid_png = Path(receipt["hybrid_png"])
          if not hybrid_png.is_file() or hybrid_png.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("strict Hybrid semantic continuation did not produce a real PNG")
          for field in ("golden_quality_approved", "publication_ready"):
              if receipt.get(field) is not False:
                  raise SystemExit(f"Hybrid semantic continuation illegally changed gate: {field}")
          PY

      - name: Build tamper-evident Golden evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_build_gpu_evidence_manifest.py \
            --result output/phase18_gpu_smoke/first-png-result.json \
            --include output/phase18_gpu_smoke/repository-integrity.json \
            --include output/phase18_gpu_smoke/first-golden-cache-budget.json \
            --include output/phase18_gpu_smoke/semantic-preflight.json \
            --include output/phase18_gpu_smoke/qwen-model-cache.json \
            --include output/phase18_gpu_smoke/model-cache.json \
            --include output/phase18_gpu_smoke/readiness.json \
            --include output/phase18_gpu_smoke/first-png-provenance-postflight.json \
            --include output/phase18_gpu_smoke/first-png-hybrid-handoff.json \
            --include output/phase18_gpu_smoke/hybrid-semantic-continuation.json \
            --include output/phase18_gpu_host/qualification.json \
            --output output/phase18_gpu_smoke/evidence-manifest.json \
            | tee output/phase18_gpu_smoke/evidence-manifest-console.json

      - name: Replay evidence integrity before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_verify_gpu_evidence_manifest.py \
            --manifest output/phase18_gpu_smoke/evidence-manifest.json \
            --receipt output/phase18_gpu_smoke/evidence-verification.json \
            | tee output/phase18_gpu_smoke/evidence-verification-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("output/phase18_gpu_smoke/evidence-verification.json").read_text(encoding="utf-8"))
          if receipt.get("status") != "GOLDEN_GPU_EVIDENCE_VERIFIED":
              raise SystemExit("Golden GPU evidence replay verification did not pass")
          if receipt.get("publication_ready") is not False:
              raise SystemExit("Evidence verification must not self-authorize publication")
          PY

      - name: Upload genuine Golden smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-golden-gpu-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/phase18_gpu_smoke/**
            output/phase18_gpu_host/**
            output/phase18_colab/**
            output/phase18_visual_proof/**
            output/phase18_generated/**
            output/phase18_worker_telemetry/**
            output/phase18_generation_queue/**
            output/phase18_handoffs/golden-batch/**
