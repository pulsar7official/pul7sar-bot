name: Phase 17 Verification

on:
  push:
    paths:
      - '.github/workflows/phase17-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-phase17:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        run: |
          python -m py_compile main.py
          python -m py_compile engine/templates/components/breaking.py
          python -m py_compile engine/templates/components/headline.py
          python -m py_compile engine/templates/components/overlay.py
          python -m py_compile engine/templates/implementations/breaking.py
          python -m py_compile engine/bootstrap.py
          python -m py_compile scripts/preview_templates.py
          python -m py_compile tests/test_breaking_template.py
          python -m py_compile tests/test_news_template_refactor.py

      - name: Run Phase 17 targeted tests
        run: |
          python -m unittest -v             tests.test_breaking_template             tests.test_news_template_refactor             tests.test_template_components             tests.test_bootstrap             tests.test_news_template_theme

      - name: Generate Phase 17 previews
        run: |
          python -m scripts.render_news_preview
          python -m scripts.preview_themes
          python -m scripts.preview_templates

      - name: Verify News and Breaking previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          news = Path("scripts/preview_news.jpg")
          breaking = Path("scripts/preview_breaking.jpg")

          for path in (news, breaking):
              if not path.is_file():
                  raise SystemExit(f"Missing preview: {path}")

              with Image.open(path) as img:
                  print(
                      path.name,
                      "format=", img.format,
                      "size=", img.size,
                      "mode=", img.mode,
                      "bytes=", path.stat().st_size,
                  )
                  assert img.format == "JPEG"
                  assert img.size == (1280, 720)
                  assert img.mode == "RGB"

          news_bytes = news.read_bytes()
          breaking_bytes = breaking.read_bytes()

          assert news_bytes != breaking_bytes, (
              "News and Breaking previews must differ"
          )

          print("news bytes:", len(news_bytes))
          print("breaking bytes:", len(breaking_bytes))
          print("Phase 17 preview verification PASS")
          PY

      - name: Upload Phase 17 previews
        uses: actions/upload-artifact@v4
        with:
          name: phase17-previews
          path: |
            scripts/preview_news.jpg
            scripts/preview_breaking.jpg
            scripts/preview_default.jpg
            scripts/preview_real_madrid.jpg
            scripts/preview_barcelona.jpg
            scripts/preview_chelsea.jpg
            scripts/preview_liverpool.jpg
          if-no-files-found: warn
          retention-days: 7

      - name: Run full legacy test suite (diagnostic only)
        continue-on-error: true
        run: |
          echo "This step is informational and does not gate Phase 17."
          python -m unittest discover -s tests -v
