name: Phase 18 First Genuine Golden Editorial v6

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PHASE18_FIRST_GENUINE_GOLDEN_V6 to execute Candidate 1 on the immutable Phase 18 source"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase18-first-genuine-golden-v6
  cancel-in-progress: false

jobs:
  candidate-1-genuine-golden-v6:
    runs-on: [self-hosted, linux, x64, gpu, cuda, bf16, pul7sar-phase18]
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      PUL7SAR_PHASE18_COST_MODE: $0-local

    steps:
      - name: Require explicit confirmation and immutable Phase 18 dispatch
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PHASE18_FIRST_GENUINE_GOLDEN_V6"
          test "$DISPATCH_REF" = "refs/heads/phase18/story-intelligence"
          printf '%s' "$DISPATCH_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout immutable Phase 18 commit with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reattach exact Phase 18 branch and prove main isolation
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          git checkout -B phase18/story-intelligence "$DISPATCH_SHA"
          test "$(git branch --show-current)" = "phase18/story-intelligence"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -f tools/phase18_colab_first_genuine_resources_locked.py
          test -f tools/phase18_colab_first_genuine_golden.py
          test -f tools/phase18_preflight_semantic_gpu.py
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          if git diff --name-only "$base"...HEAD | grep -qx 'main.py'; then
            echo "Unexpected main.py modification detected in Phase 18 diff." >&2
            exit 6
          fi

      - name: Prove CUDA-enabled PyTorch exists without replacing it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA-enabled PyTorch is required; refusing to install or replace PyTorch automatically")
          print({"torch": torch.__version__, "cuda": torch.version.cuda, "devices": torch.cuda.device_count()})
          PY

      - name: Preflight immutable Qwen semantic runtime and snapshot before FLUX
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_preflight_semantic_gpu.py \
            --output output/phase18_gpu_smoke/semantic-preflight.json \
            --qwen-cache-receipt output/phase18_gpu_smoke/qwen-model-cache.json
          python - <<'PY'
          import json
          from pathlib import Path
          from engine.intelligence.approved_model_revisions import QWEN25_VL_3B_MODEL_ID, QWEN25_VL_3B_REVISION

          receipt = json.loads(Path("output/phase18_gpu_smoke/semantic-preflight.json").read_text(encoding="utf-8"))
          if receipt.get("schema") != "pul7sar-phase18-semantic-gpu-preflight-v2":
              raise SystemExit("semantic preflight schema drift")
          if receipt.get("branch") != "phase18/story-intelligence":
              raise SystemExit("semantic preflight branch drift")
          if receipt.get("model_id") != QWEN25_VL_3B_MODEL_ID:
              raise SystemExit("semantic model id drift")
          if receipt.get("model_revision") != QWEN25_VL_3B_REVISION:
              raise SystemExit("semantic model revision drift")
          if receipt.get("resolved_snapshot_revision") != QWEN25_VL_3B_REVISION or receipt.get("revision_pinned") is not True:
              raise SystemExit("semantic snapshot revision not pinned")
          if receipt.get("cost_mode") != "$0-local":
              raise SystemExit("semantic preflight escaped zero-cost policy")
          if receipt.get("semantic_runtime_ready") is not True or receipt.get("semantic_model_ready") is not True:
              raise SystemExit("semantic runtime/model not ready before FLUX")
          if receipt.get("cuda_available") is not True:
              raise SystemExit("semantic CUDA runtime not proven")
          for field in ("generation_authorized", "queue_mutated", "png_created", "publication_ready"):
              if receipt.get(field) is not False:
                  raise SystemExit(f"semantic preflight authority drift: {field}")
          print({
              "status": "IMMUTABLE_QWEN_SEMANTIC_PREFLIGHT_VERIFIED",
              "model_id": receipt.get("model_id"),
              "model_revision": receipt.get("model_revision"),
              "publication_ready": False,
          })
          PY

      - name: Run resource/runtime-locked strict Golden Editorial v6 Candidate 1
        shell: bash
        run: |
          set -euo pipefail
          python tools/phase18_colab_first_genuine_resources_locked.py \
            --output output/phase18_gpu_smoke/first-genuine-golden-v6-resource-lock.json

      - name: Replay exact semantic resource runtime and staging evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from engine.intelligence.approved_model_revisions import QWEN25_VL_3B_MODEL_ID, QWEN25_VL_3B_REVISION
          from engine.intelligence.generation_runtime_fingerprint import verify_matching_runtime_fingerprints

          root = Path.cwd().resolve()
          semantic_path = root / "output/phase18_gpu_smoke/semantic-preflight.json"
          if not semantic_path.is_file():
              raise SystemExit("immutable Qwen semantic preflight receipt missing")
          semantic = json.loads(semantic_path.read_text(encoding="utf-8"))
          if semantic.get("schema") != "pul7sar-phase18-semantic-gpu-preflight-v2":
              raise SystemExit("semantic preflight schema drift during replay")
          if semantic.get("model_id") != QWEN25_VL_3B_MODEL_ID or semantic.get("model_revision") != QWEN25_VL_3B_REVISION:
              raise SystemExit("semantic model identity drift during replay")
          if semantic.get("resolved_snapshot_revision") != QWEN25_VL_3B_REVISION or semantic.get("revision_pinned") is not True:
              raise SystemExit("semantic snapshot revision drift during replay")
          if semantic.get("semantic_runtime_ready") is not True or semantic.get("semantic_model_ready") is not True or semantic.get("cuda_available") is not True:
              raise SystemExit("semantic preflight readiness drift during replay")
          if semantic.get("cost_mode") != "$0-local":
              raise SystemExit("semantic preflight zero-cost drift during replay")
          for field in ("generation_authorized", "queue_mutated", "png_created", "publication_ready"):
              if semantic.get(field) is not False:
                  raise SystemExit(f"semantic preflight authority drift during replay: {field}")

          final_path = root / "output/phase18_gpu_smoke/first-genuine-golden-v6-resource-lock.json"
          if not final_path.is_file():
              raise SystemExit("first genuine Golden v6 resource/runtime-lock receipt missing")
          final = json.loads(final_path.read_text(encoding="utf-8"))
          if final.get("schema") != "pul7sar-first-genuine-golden-v6-resource-lock-v2":
              raise SystemExit("unexpected first genuine Golden v6 resource/runtime-lock schema")
          if final.get("status") != "FIRST_GENUINE_GOLDEN_V6_RESOURCE_RUNTIME_LOCK_VERIFIED":
              raise SystemExit("first genuine Golden v6 resource/runtime lock not verified")
          if final.get("branch") != "phase18/story-intelligence" or final.get("candidate") != 1:
              raise SystemExit("first genuine Golden v6 identity drift")
          if final.get("cost_mode") != "$0-local" or final.get("native_bf16_proven") is not True:
              raise SystemExit("first genuine Golden v6 zero-cost/BF16 contract drift")
          if final.get("gpu_eligible") is not True or final.get("host_memory_ready") is not True:
              raise SystemExit("first genuine Golden v6 resources not proven")
          if final.get("runtime_stable_across_generation") is not True:
              raise SystemExit("first genuine Golden v6 runtime stability not proven")
          for field in ("human_visual_review_approved", "golden_quality_approved", "publication_ready", "seeds_2_to_4_authorized"):
              if final.get(field) is not False:
                  raise SystemExit(f"illegal authority drift: {field}")

          def inside(value: str) -> Path:
              path = Path(value)
              if not path.is_absolute():
                  path = root / path
              path = path.resolve()
              if path != root and root not in path.parents:
                  raise SystemExit(f"evidence path escaped repository: {path}")
              return path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          evidence = final.get("evidence")
          expected = {
              "gpu_host_qualification",
              "host_memory_preflight",
              "runtime_fingerprint_pre",
              "runtime_fingerprint_post",
              "strict_golden_staging",
          }
          if not isinstance(evidence, dict) or set(evidence) != expected:
              raise SystemExit("first genuine Golden v6 evidence set incomplete")
          for label, record in evidence.items():
              if not isinstance(record, dict):
                  raise SystemExit(f"invalid evidence record: {label}")
              path = inside(str(record.get("path", "")))
              if not path.is_file():
                  raise SystemExit(f"evidence missing: {label}")
              if sha256(path) != record.get("sha256") or path.stat().st_size != record.get("bytes"):
                  raise SystemExit(f"evidence replay mismatch: {label}")

          runtime_pre = json.loads(inside(str(evidence["runtime_fingerprint_pre"]["path"])).read_text(encoding="utf-8"))
          runtime_post = json.loads(inside(str(evidence["runtime_fingerprint_post"]["path"])).read_text(encoding="utf-8"))
          runtime_sha = verify_matching_runtime_fingerprints(runtime_pre, runtime_post)
          if runtime_sha != final.get("runtime_fingerprint_sha256"):
              raise SystemExit("first genuine Golden v6 runtime fingerprint binding drift")

          staging = json.loads(inside(str(evidence["strict_golden_staging"]["path"])).read_text(encoding="utf-8"))
          if staging.get("schema") != "pul7sar-first-genuine-golden-staging-v3":
              raise SystemExit("strict staging schema drift")
          if staging.get("semantic_model_id") != QWEN25_VL_3B_MODEL_ID or staging.get("semantic_model_revision") != QWEN25_VL_3B_REVISION:
              raise SystemExit("strict staging semantic identity drift")
          if staging.get("semantic_approved") is not True or staging.get("layer_ownership_approved") is not True:
              raise SystemExit("strict staging semantic/layer gate not approved")
          if staging.get("resolved_dtype") != "bfloat16" or staging.get("precision_quality_tier") != "golden_reference":
              raise SystemExit("strict staging precision drift")
          if staging.get("cost_mode") != "$0-local":
              raise SystemExit("strict staging zero-cost drift")
          for field in ("golden_quality_approved", "publication_ready", "seeds_2_to_4_authorized"):
              if staging.get(field) is not False:
                  raise SystemExit(f"strict staging authority drift: {field}")

          png = inside(str(final.get("png", "")))
          if not png.is_file() or png.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Golden v6 PNG missing or invalid")
          if sha256(png) != final.get("png_sha256") or final.get("png_sha256") != staging.get("png_sha256"):
              raise SystemExit("Golden v6 PNG SHA binding drift")

          print(json.dumps({
              "status": "FIRST_GENUINE_GOLDEN_V6_WORKFLOW_EVIDENCE_REPLAY_VERIFIED",
              "candidate": 1,
              "semantic_model_revision": semantic.get("model_revision"),
              "runtime_fingerprint_sha256": runtime_sha,
              "png": str(png),
              "publication_ready": False,
              "seeds_2_to_4_authorized": False,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload genuine Golden v6 Candidate 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-first-genuine-golden-v6-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/phase18_gpu_smoke/**
            output/phase18_gpu_host/**
            output/phase18_colab/**
            output/phase18_visual_proof/**
            output/phase18_generated/**
            output/phase18_handoffs/golden-batch/**
