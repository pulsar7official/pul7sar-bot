name: Phase 18 Cinematic 3D V2 Benchmark

on:
  push:
    branches:
      - phase18/original-visual-benchmark
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-cinematic-v2:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python Blender and headless GL
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y blender xvfb libegl1 libgl1-mesa-dri libglx-mesa0 mesa-utils
          blender --version
      - name: Smoke render cinematic V2
        run: |
          set -euo pipefail
          sed -i "/\\$\.replace/d" tools/phase18_blender_family_scene_v2.py
          sed -i "s/sc.render.resolution_x=1080/sc.render.resolution_x=540/" tools/phase18_blender_family_scene_v2.py
          sed -i "s/sc.render.resolution_y=1350/sc.render.resolution_y=675/" tools/phase18_blender_family_scene_v2.py
          sed -i "s/fog_volume(); compositor(sc)/compositor(sc)/" tools/phase18_blender_family_scene_v2.py
          python -m py_compile tools/phase18_blender_family_scene_v2.py
          mkdir -p artifacts/phase18/cinematic-v2-smoke/base
          xvfb-run -a blender -b --python-exit-code 1 --python tools/phase18_blender_family_scene_v2.py -- --family transfer_signature --variant a --seed 8101 --accent-a C90B22 --accent-b 174EA6 --output artifacts/phase18/cinematic-v2-smoke/base/01-transfer-arrival.png
          test -s artifacts/phase18/cinematic-v2-smoke/base/01-transfer-arrival.png
      - uses: actions/upload-artifact@v7
        with:
          name: phase18-cinematic-3d-v2-smoke
          path: artifacts/phase18/cinematic-v2-smoke/base/
          if-no-files-found: error
          retention-days: 3
